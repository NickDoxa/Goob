[project]
name = "goob-brain"
version = "0.1.0"
description = "Discord-controlled Braccio arm with Claude vision."
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.3",
    "anthropic>=0.40",
    "opencv-python>=4.8",
    # Inverse kinematics for the look_at tool (src/kinematics.py). numpy
    # arrives transitively via opencv-python.
    "ikpy>=3.4",
    "pyserial>=3.5",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# Voice frontend. Install with `pip install -e .[voice]`. Requires libportaudio
# system package on Linux (apt install libportaudio2 portaudio19-dev).
#
# openwakeword is intentionally NOT in this list — it declares tflite-runtime
# as a hard Linux requirement, and tflite-runtime has no Python 3.13 wheels.
# We use the ONNX backend instead (onnxruntime ships transitively via
# faster-whisper). Install separately:
#     pip install --no-deps openwakeword>=0.6
voice = [
    "sounddevice>=0.4",
    "numpy>=1.26",
    "webrtcvad-wheels>=2.0.14",
    "faster-whisper>=1.0",
]
# Google Calendar read access (src/gcal.py). Install with
# `pip install -e .[calendar]`. OAuth happens once on your PC via
# tools/get_google_token.py — see that script's docstring.
calendar = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.0",
    "google-auth>=2.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
